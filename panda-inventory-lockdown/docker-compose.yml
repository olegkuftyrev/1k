services:
  db:
    image: postgres:16-alpine
    container_name: panda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda
      POSTGRES_PASSWORD: panda
      POSTGRES_DB: panda
    ports:
      - "5434:5432"
    volumes:
      - panda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda -d panda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  panda-db-data:
